server:
  # 8080 is taken by the Keycloak container on the dev machine.
  port: ${SERVER_PORT:8081}

spring:
  application:
    name: investulator-be
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/investulator?createDatabaseIfNotExist=true&connectionTimeZone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health
